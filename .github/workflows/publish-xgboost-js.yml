name: Publish xgboost-js to NPM

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Library
        run: npm run ng -- build xgboost-js --configuration production

      - name: Publish
        run: npm publish dist/xgboost-js --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
