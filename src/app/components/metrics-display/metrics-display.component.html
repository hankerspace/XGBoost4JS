<div class="rounded-xl border bg-card text-card-foreground shadow p-6 h-full">
  <h3 class="font-semibold leading-none tracking-tight mb-6">Model Performance (Test Set)</h3>

  <div class="flex flex-col sm:flex-row items-center gap-8">
    <!-- Circular Gauge for R2 -->
    <div class="relative flex flex-col items-center justify-center">
      <svg class="w-32 h-32 transform -rotate-90">
        <!-- Background Circle -->
        <circle
          cx="64" cy="64" r="56"
          stroke="currentColor" stroke-width="12" fill="transparent"
          class="text-muted/20"
        />
        <!-- Progress Circle -->
        <circle
          cx="64" cy="64" r="56"
          stroke="currentColor" stroke-width="12" fill="transparent"
          [attr.stroke-dasharray]="circumference"
          [attr.stroke-dashoffset]="strokeDashoffset"
          stroke-linecap="round"
          class="transition-all duration-1000 ease-out"
          [class.text-red-500]="r2Score < 0.5"
          [class.text-yellow-500]="r2Score >= 0.5 && r2Score < 0.8"
          [class.text-green-500]="r2Score >= 0.8"
        />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
        <span class="text-2xl font-bold"
              [class.text-red-600]="r2Score < 0.5"
              [class.text-yellow-600]="r2Score >= 0.5 && r2Score < 0.8"
              [class.text-green-600]="r2Score >= 0.8">
          {{ r2Score | percent:'1.0-1' }}
        </span>
        <span class="text-xs text-muted-foreground font-medium uppercase tracking-wider">R² Score</span>
      </div>
    </div>

    <!-- Other Metrics Grid -->
    <div class="flex-1 grid grid-cols-1 gap-4 w-full">
      <!-- RMSE -->
      <div class="flex items-center justify-between p-3 rounded-lg bg-muted/50 border border-border/50">
        <div class="flex flex-col">
          <span class="text-xs text-muted-foreground font-medium uppercase">RMSE</span>
          <span class="text-lg font-semibold tracking-tight">{{ metrics.rmse | number:'1.4-4' }}</span>
        </div>
        <div class="h-8 w-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center dark:bg-blue-900/30 dark:text-blue-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-12"/></svg>
        </div>
      </div>

      <!-- MAE -->
      <div class="flex items-center justify-between p-3 rounded-lg bg-muted/50 border border-border/50">
        <div class="flex flex-col">
          <span class="text-xs text-muted-foreground font-medium uppercase">MAE</span>
          <span class="text-lg font-semibold tracking-tight">{{ metrics.mae | number:'1.4-4' }}</span>
        </div>
        <div class="h-8 w-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center dark:bg-purple-900/30 dark:text-purple-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>
        </div>
      </div>

      <!-- BIAS -->
      <div class="flex items-center justify-between p-3 rounded-lg bg-muted/50 border border-border/50">
        <div class="flex flex-col">
          <span class="text-xs text-muted-foreground font-medium uppercase">Bias</span>
          <span class="text-lg font-semibold tracking-tight">{{ metrics.bias | number:'1.4-4' }}</span>
        </div>
        <div class="h-8 w-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center dark:bg-orange-900/30 dark:text-orange-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>
